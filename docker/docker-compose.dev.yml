version: '3.8'

services:
  # MySQL Database (Development)
  mysql:
    image: mysql:8.0
    container_name: backend-mysql-dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: TuPasswordRoot123!
      MYSQL_DATABASE: internships_db
      MYSQL_USER: appuser
      MYSQL_PASSWORD: TuPasswordSeguro123!
    ports:
      - "3306:3306"
    volumes:
      - mysql_data_dev:/var/lib/mysql
      - ./mysql_conf/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    networks:
      - backend-network-dev
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # ASP.NET Core Backend (Development)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - ASPNETCORE_ENVIRONMENT=Development
    container_name: backend-api-dev
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=mysql;Database=internships_db;User=appuser;Password=TuPasswordSeguro123!;Port=3306;CharSet=utf8mb4;
      - ASPNETCORE_URLS=http://+:5000
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backend-network-dev
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  mysql_data_dev:
    driver: local

networks:
  backend-network-dev:
    driver: bridge
    ipam:
      config:
        - subnet: 172.18.0.0/16